<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>St. Johns College Library</title>
<style>
body{font-family:Arial;background:#f0f4f8;margin:0;padding:15px;}
.box{max-width:500px;margin:80px auto 20px;background:white;padding:20px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
h2{color:#1e40af;text-align:center;}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font-size:15px;}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px;}
.btn-issue{background:#059669;color:white;}
.btn-return{background:#dc2626;color:white;}
.card{padding:12px;border-radius:10px;margin:10px 0;background:#f1f5f9;border-left:5px solid #2563eb;}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f172a;z-index:9999;display:flex;justify-content:center;align-items:center;}
</style>
</head>
<body>
<div id="loginScreen">
  <div style="background:white;padding:30px;border-radius:20px;width:85%;max-width:320px;text-align:center;">
    <h2 style="margin:0;">🔒 St. Johns Library</h2>
    <p>Enter Password to Access Library</p>
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="checkPass()" style="background:#2563eb;color:white;">Login</button>
    <p id="passError" style="color:red;display:none;margin-top:10px;">Wrong Password!</p>
    <p style="font-size:11px;color:gray;margin-top:15px;">Default: stjohns123</p>
  </div>
</div>
<button id="settingsBtn" onclick="changePassword()" style="position:fixed;top:12px;right:12px;z-index:100;width:auto;padding:8px 16px;background:#334155;color:white;border-radius:20px;display:none;">🔑 Change Password</button>
<button onclick="logout()" style="position:fixed;top:12px;left:12px;z-index:100;width:auto;padding:8px 16px;background:#ef4444;color:white;border-radius:20px;">Logout</button>
<div class="box">
<h2>St. Johns College Library</h2>
<p style="text-align:center;color:#059669;font-weight:bold;background:#dcfce7;padding:8px;border-radius:8px;">⚠️ Max 2 Books Per Student Rule</p>
<input type="text" id="studentName" placeholder="Student Name">
<input type="text" id="rollNumber" placeholder="Roll Number">
<input type="text" id="bookNumber" placeholder="Book Number">
<input type="text" id="bookName" placeholder="Book Name">
<button class="btn-issue" onclick="issueBook()">✓ Issue Book</button>
<button class="btn-return" onclick="returnBook()">↩ Return Book</button>
<hr style="margin:20px 0;">
<h3 style="font-size:16px;">Teacher Search - Enter Roll Number</h3>
<input type="text" id="teacherSearch" placeholder="Enter Roll Number" onkeyup="showBooks()">
<div id="list"></div>
</div>
<script>
if(!localStorage.getItem('libPass')){localStorage.setItem('libPass','stjohns123');}
function checkLogin(){if(sessionStorage.getItem('loggedIn')==='yes'){document.getElementById('loginScreen').style.display='none';document.getElementById('settingsBtn').style.display='block';}}
checkLogin();
function checkPass(){let e=document.getElementById('passInput').value;let r=localStorage.getItem('libPass');if(e===r){sessionStorage.setItem('loggedIn','yes');document.getElementById('loginScreen').style.display='none';document.getElementById('settingsBtn').style.display='block';}else{document.getElementById('passError').style.display='block';}}
function changePassword(){let o=prompt("Enter Old Password:");if(o!==localStorage.getItem('libPass')){alert("Wrong Old!");return;}let n=prompt("New Password:");if(!n||n.length<4){alert("Too short!");return;}localStorage.setItem('libPass',n);alert("✅ Changed: "+n);}
function logout(){sessionStorage.removeItem('loggedIn');location.reload();}
let books=JSON.parse(localStorage.getItem("stjohns_lib"))||[];
function issueBook(){
  let s=document.getElementById('studentName').value.trim();
  let r=document.getElementById('rollNumber').value.trim();
  let bn=document.getElementById('bookNumber').value.trim();
  let bname=document.getElementById('bookName').value.trim();
  if(!s||!r||!bn||!bname){alert("Please fill all fields!");return;}
  let count = books.filter(x=>x.rollNumber.toLowerCase()===r.toLowerCase()).length;
  if(count>=2){alert("❌ LIMIT REACHED! Student "+r+" already has 2 books. Please return one book first!");return;}
  if(books.some(x=>x.bookNumber===bn)){alert("❌ This Book Number already issued!");return;}
  books.push({studentName:s,rollNumber:r,bookNumber:bn,bookName:bname,time:new Date().toLocaleString()});
  localStorage.setItem("stjohns_lib",JSON.stringify(books));
  document.getElementById('studentName').value='';document.getElementById('rollNumber').value='';document.getElementById('bookNumber').value='';document.getElementById('bookName').value='';
  showBooks();alert("✅ Book Issued! ("+(count+1)+"/2)");
}
function returnBook(){
  let bn=document.getElementById('bookNumber').value.trim();
  if(!bn){alert("Enter Book Number to return!");return;}
  let idx=books.findIndex(x=>x.bookNumber===bn);
  if(idx===-1){alert("Book Number not found!");return;}
  books.splice(idx,1);localStorage.setItem("stjohns_lib",JSON.stringify(books));showBooks();alert("✅ Returned!");
}
function showBooks(){
  let filter=document.getElementById('teacherSearch').value.toLowerCase();
  let html="";let filtered = books.slice().reverse().filter(x=>x.rollNumber.toLowerCase().includes(filter)||x.studentName.toLowerCase().includes(filter)||x.bookNumber.toLowerCase().includes(filter));
  filtered.forEach(x=>{html+=`<div class="card"><b>${x.bookName}</b> (${x.bookNumber})<br>👤 ${x.studentName} - ${x.rollNumber}<br><small>${x.time}</small></div>`;});
  document.getElementById('list').innerHTML=html||"<p style='text-align:center;color:gray;'>No Records</p>";
}
showBooks();
</script>
</body>
</html>
